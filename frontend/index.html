<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antardrishti | Silent Health Vision</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Antardrishti</h1>

    <h2>Silent Health Vision</h2>

    <p>
        A smart health-monitoring prototype that silently observes
        health signals and provides early health awareness.
    </p>

    <div class="dashboard">

        <h3>Health Dashboard</h3>

        <div class="cards">

            <div class="card">
                <h3>❤️ Heart Rate</h3>
                <p class="value" id="heartRate">72 BPM</p>
            </div>

            <div class="card">
                <h3>🫁 SpO₂</h3>
                <p class="value" id="spo2">98%</p>
            </div>

            <div class="card">
                <h3>🌡️ Temperature</h3>
                <p class="value" id="temperature">36.7°C</p>
            </div>

        </div>

        <div class="status">
            <h3>Health Status</h3>
            <p id="healthStatus">Normal — No unusual readings detected.</p>
        </div>

    </div>
    <script>
function updateHealth() {
let alertMode = Math.random() < 0.25;

let heartRate = alertMode
  ? Math.floor(105 + Math.random() * 15)
  : Math.floor(65 + Math.random() * 25);

let spo2 = alertMode
  ? Math.floor(90 + Math.random() * 5)
  : Math.floor(96 + Math.random() * 3);

let temperature = alertMode
  ? (38.1 + Math.random() * 0.9).toFixed(1)
  : (36.5 + Math.random() * 1).toFixed(1);
    document.getElementById("heartRate").innerText = heartRate + " BPM";
    document.getElementById("spo2").innerText = spo2 + "%";
    document.getElementById("temperature").innerText = temperature + "°C";

    let status = document.getElementById("healthStatus");

    if (heartRate > 100 || spo2 < 95 || temperature > 38) {
        status.innerText = "⚠️ Attention — Unusual reading detected.";
    } else {
        status.innerText = "🟢 Normal — No unusual readings detected.";
    }
}

updateHealth();
setInterval(updateHealth, 3000);
</script>
</body>
</html>
