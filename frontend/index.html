<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antardrishti | Silent Health Vision</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Antardrishti</h1>

    <h2>Silent Health Vision</h2>

    <p>
        A smart health-monitoring prototype that silently observes
        health signals and provides early health awareness.
    </p>

    <div class="dashboard">

        <h3>Health Dashboard</h3>

        <div class="cards">

            <div class="card">
                <h3>❤️ Heart Rate</h3>
                <p class="value">72 BPM</p>
            </div>

            <div class="card">
                <h3>🫁 SpO₂</h3>
                <p class="value">98%</p>
            </div>

            <div class="card">
                <h3>🌡️ Temperature</h3>
                <p class="value">36.7°C</p>
            </div>

        </div>

        <div class="status">
            <h3>Health Status</h3>
            <p>🟢 Normal — No unusual readings detected.</p>
        </div>

    </div>

</body>

</html>
